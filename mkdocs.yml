site_name: go-fsctl
site_description: Pure-Go (CGO=0) Linux kernel-ioctl control libraries — loop devices, device-mapper, btrfs, and OpenZFS, with no cgo and no shelling out.
site_url: https://go-fsctl.github.io/docs/
site_author: go-fsctl contributors

repo_name: go-fsctl
repo_url: https://github.com/go-fsctl

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
    - navigation.tabs
    - navigation.expand
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme)"
      scheme: default
      primary: cyan
      accent: deep purple
      toggle: { icon: material/brightness-auto, name: Auto }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: cyan
      accent: deep purple
      toggle: { icon: material/brightness-4, name: Light }

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc: { permalink: "#" }
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.tasklist: { custom_checkbox: true }

nav:
  - Home: index.md
  - Modules:
      - loop/: loop.md
      - dm/: dm.md
      - btrfs/: btrfs.md
      - zfs/: zfs.md
      - cowclone/: cowclone.md

extra:
  version:
    provider: mike
    default: latest
